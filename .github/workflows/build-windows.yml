name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 러너에 한글 글꼴이 없으면 한글이 빈 글리프로 인쇄되어 PDF 글자 검사가 실패한다.
      - name: 한글 글꼴 설치
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # 빌드한 앱을 실행해 샘플 EPUB을 실제 PDF로 변환하고, 화면을 조작해 본다.
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots-linux
          path: test-results/gui/
          if-no-files-found: ignore

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Windows에서도 실제 변환과 화면 조작이 되는지 확인한다. 화면 사진은 결과물로 올린다.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots-windows
          path: test-results/gui/
          if-no-files-found: ignore
      - run: npm run build:win
        env:
          # 코드 서명 인증서가 없으므로 서명 단계를 건너뛴다.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: EPUBtoPDF-windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Release에 설치 파일 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
