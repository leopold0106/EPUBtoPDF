name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 빌드한 앱을 실행해 샘플 EPUB을 실제 PDF로 변환해 본다.
      - run: xvfb-run -a npm run test:e2e

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Windows에서도 실제 변환이 되는지 확인한다.
      - run: npm run test:e2e
      - run: npm run build:win
        env:
          # 코드 서명 인증서가 없으므로 서명 단계를 건너뛴다.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: EPUBtoPDF-windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Release에 설치 파일 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
